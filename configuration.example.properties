# Bu dosyayı "configuration.properties" adıyla kopyalayıp değerleri doldurun.
# configuration.properties .gitignore içindedir; şifreler GitHub'a gönderilmez.
# Her anahtar aynı isimli ortam değişkeni ile de verilebilir (ör. DB_PASSWORD, USER_PASSWORD).

base.url=https://snackattack.deployedprojects.xyz/
api.base.url=https://snackattack-api.deployedprojects.xyz

browser=chrome
headless=false
timeout=15

# Aktif (e-posta ile onaylanmış) User test hesabı – giriş gerektiren testler için
user.email=
user.password=

# Admin test hesabı – admin testleri için (eğitmenden)
admin.email=
admin.password=

# PostgreSQL (salt okunur kullanıcı)
db.host=
db.port=
db.name=snack_attack_db
db.schema=snack_attack
db.user=db_readonly
db.password=
